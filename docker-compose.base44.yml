name: mersal

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    labels:
      base44.project: "مرسال — قاعدة البيانات"
      base44.kind: "infra"
    environment:
      - POSTGRES_USER=mersal
      - POSTGRES_PASSWORD=mersal_dev_password
      - POSTGRES_DB=mersal
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mersal -d mersal"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: on-failure
    working_dir: /srv
    labels:
      base44.project: "مرسال API"
      base44.kind: "api"
      base44.port: "8000"
      base44.docs: "/docs"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - DATABASE_URL=postgresql+psycopg://mersal:mersal_dev_password@db:5432/mersal
      - MEDIA_DIR=/data/media
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
    volumes:
      - ./backend:/srv
      - media-data:/data/media
    command:
      [
        "sh",
        "-ec",
        "exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /srv/app",
      ]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  web:
    image: node:22-alpine
    restart: on-failure
    working_dir: /app
    labels:
      base44.project: "مرسال"
      base44.kind: "web"
      base44.port: "3000"
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - ./frontend:/app
      - node-modules:/app/node_modules
    command:
      ["sh", "-ec", "npm ci --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 3000"]
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # One-shot test runner. Gated behind the "test" profile so a normal
  # `up -d` never starts it.
  tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    profiles: ["test"]
    working_dir: /srv
    labels:
      base44.project: "مرسال — الاختبارات"
      base44.kind: "worker"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - DATABASE_URL=postgresql+psycopg://mersal:mersal_dev_password@db:5432/mersal
      - MEDIA_DIR=/tmp/mersal-media-test
      - BASE44_PREVIEW_MODE
    volumes:
      - ./backend:/srv
    command: ["sh", "-ec", "exec python -m pytest -q tests"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  media-data:
  node-modules:
